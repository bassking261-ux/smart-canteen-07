<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartBite - Student Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <div class="logo">🍔</div>

            <h1>SmartBite</h1>

            <p class="subtitle">
                Smart Canteen Ordering
            </p>

            <form id="loginForm">

                <!-- Student Name -->
                <label>Student Name</label>

                <input
                    type="text"
                    id="studentName"
                    placeholder="Enter your name"
                    required
                >


                <!-- Department -->
                <label>Department</label>

                <input
                    type="text"
                    value="B.Sc DS & AI"
                    readonly
                >

                <input
                    type="hidden"
                    id="department"
                    value="B.Sc DS & AI"
                >


                <!-- Year -->
                <label>Year</label>

                <select id="year" required>

                    <option value="">
                        Select Year
                    </option>

                    <option value="1st Year">
                        1st Year
                    </option>

                    <option value="2nd Year">
                        2nd Year
                    </option>

                    <option value="3rd Year">
                        3rd Year
                    </option>

                </select>


                <!-- Login Button -->
                <button type="submit">
                    Login →
                </button>

            </form>

        </div>

    </div>


    <script src="js/login.js"></script>

</body>

</html>
